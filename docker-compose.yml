version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: baselinedb
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-server-handshake
    environment:
      MYSQL_ROOT_PASSWORD: root_password_secure
      MYSQL_DATABASE: baselinedb
      MYSQL_USER: baseline
      MYSQL_PASSWORD: base1234
    volumes:
      - db_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d
    #ports:
    #  - "3306:3306" # 로컬에서 DB에 직접 접근해야 할 경우에만 사용, 아니면 제거
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "baseline", "-pbase1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baseline_web
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/baselinedb?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
      DB_USER: baseline
      DB_PASSWORD: base1234

volumes:
  db_data: